name: Prode WC2026 Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min (en práctica corre cada 1-2h por delays de GitHub)
  workflow_dispatch:          # también se puede correr manualmente desde GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy scipy requests

      - name: Restore predictions_last.json
        uses: actions/cache@v4
        with:
          path: predictions_last.json
          key: predictions-last-${{ github.run_id }}
          restore-keys: predictions-last-

      - name: Restore predictions_locked.json
        uses: actions/cache@v4
        with:
          path: predictions_locked.json
          key: predictions-locked-${{ github.run_id }}
          restore-keys: predictions-locked-

      - name: Restore last_daily_report.txt
        uses: actions/cache@v4
        with:
          path: last_daily_report.txt
          key: daily-flag-${{ github.run_id }}
          restore-keys: daily-flag-

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Save predictions_last.json
        uses: actions/cache/save@v4
        if: always()
        with:
          path: predictions_last.json
          key: predictions-last-${{ github.run_id }}

      - name: Save predictions_locked.json
        uses: actions/cache/save@v4
        if: always()
        with:
          path: predictions_locked.json
          key: predictions-locked-${{ github.run_id }}

      - name: Save last_daily_report.txt
        uses: actions/cache/save@v4
        if: always()
        with:
          path: last_daily_report.txt
          key: daily-flag-${{ github.run_id }}

      - name: Commit predictions_locked.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions_locked.json
          git diff --cached --quiet || git commit -m "update predictions_locked.json [skip ci]"
          git push